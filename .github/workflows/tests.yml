name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.0'
            laravel: '11'
          - php: '8.2'
            testbench: '^10.0'
            laravel: '12'
          - php: '8.3'
            testbench: '^11.0'
            laravel: '13'
          - php: '8.4'
            testbench: '^11.0'
            laravel: '13'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        if: matrix.laravel != '11'
        run: composer update --prefer-dist --no-interaction

      - name: Install Laravel 11 dependencies
        if: matrix.laravel == '11'
        run: composer update --prefer-dist --no-interaction --no-blocking

      - name: Verify package
        run: composer verify
