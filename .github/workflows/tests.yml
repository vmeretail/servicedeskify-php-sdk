name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.0'
            laravel: '11'
            composer-arguments: '--no-blocking'
          - php: '8.2'
            testbench: '^10.0'
            laravel: '12'
            composer-arguments: ''
          - php: '8.3'
            testbench: '^11.0'
            laravel: '13'
            composer-arguments: ''
          - php: '8.4'
            testbench: '^11.0'
            laravel: '13'
            composer-arguments: ''

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Laravel ${{ matrix.laravel }} dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction ${{ matrix.composer-arguments }}

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check formatting
        run: composer format -- --test

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test
